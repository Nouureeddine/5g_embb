[Config FiveG_CBR_Stress_Test]
network = simu5g.simulations.nr.networks.FourGnb_Standalone
sim-time-limit = 10s

# --- 1. GLOBAL & FREQUENCY SETTINGS ---
# Disable pop-ups and handover
**.dynamicCellAssociation = false
**.enableHandover = false

# 5G Frequency (3.5 GHz)
**.carrierAggregation.numComponentCarriers = 1
**.gnb*.cellularNic.numCarriers = 1
**.gnb*.cellularNic.phy.carrierFrequency = 3.5GHz
**.ue[*].cellularNic.numCarriers = 1
**.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
**.numBands = 50 

# --- 2. GATEWAY CONFIGURATION ---
# CRITICAL: Connects towers to the core network
**.gnb*.gtpUser.upfAddr = "upf"

# --- 3. TOWER CONFIGURATION ---
# Force Tower IDs to match our plan
*.gnb1.macCellId = 1
*.gnb1.macNodeId = 1
*.gnb2.macCellId = 2
*.gnb2.macNodeId = 2
*.gnb3.macCellId = 3
*.gnb3.macNodeId = 3
*.gnb4.macCellId = 4
*.gnb4.macNodeId = 4

# --- 4. UE ATTACHMENT & PLACEMENT (80 Users) ---
*.numUe = 80
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initFromDisplayString = false

# Group 1 (UEs 0-19) -> Tower 1
# Disable LTE (0), Force NR (1)
*.ue[0..19].macCellId = 0
*.ue[0..19].masterId = 0
*.ue[0..19].nrMacCellId = 1
*.ue[0..19].nrMasterId = 1
*.ue[0..19].mobility.initialX = uniform(50m, 150m)
*.ue[0..19].mobility.initialY = uniform(450m, 550m)

# Group 2 (UEs 20-39) -> Tower 2
*.ue[20..39].macCellId = 0
*.ue[20..39].masterId = 0
*.ue[20..39].nrMacCellId = 2
*.ue[20..39].nrMasterId = 2
*.ue[20..39].mobility.initialX = uniform(250m, 350m)
*.ue[20..39].mobility.initialY = uniform(450m, 550m)

# Group 3 (UEs 40-59) -> Tower 3
*.ue[40..59].macCellId = 0
*.ue[40..59].masterId = 0
*.ue[40..59].nrMacCellId = 3
*.ue[40..59].nrMasterId = 3
*.ue[40..59].mobility.initialX = uniform(650m, 750m)
*.ue[40..59].mobility.initialY = uniform(450m, 550m)

# Group 4 (UEs 60-79) -> Tower 4
*.ue[60..79].macCellId = 0
*.ue[60..79].masterId = 0
*.ue[60..79].nrMacCellId = 4
*.ue[60..79].nrMasterId = 4
*.ue[60..79].mobility.initialX = uniform(850m, 950m)
*.ue[60..79].mobility.initialY = uniform(450m, 550m)

# --- 5. TRAFFIC: CBR (Constant Bit Rate) ---
# We create 80 applications on the server
*.server.numApps = 80
*.server.app[*].typename = "CbrSender"

# Packet Settings (1000 Bytes every 10ms = 800 Kbps)
*.server.app[*].packetSize = 1400B
*.server.app[*].samplingTime = 1ms

# Routing (Send to UEs)
# Note: CbrSender uses "destAddress" (singular)
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 5000 + ancestorIndex(0)

# CRITICAL TIMING: Wait 1.0s for 5G RRC Connection
*.server.app[*].startTime = uniform(1.0s, 1.1s)
*.server.app[*].finishTime = 10s

# --- 6. RECEIVER ---
# UEs must use CbrReceiver to understand the packets
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000

# --- 7. INFRASTRUCTURE & POWER ---
*.configurator.config = xmldoc("./demo.xml")
**.forwarding = true
**.ueTxPower = 26dBm
**.gNodeBTxPower = 40dBm

# --- 8. STATISTICS RECORDING ---
# Enable vector recording to graph the throughput later
**.vector-recording = true