[General]
abstract = true
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.vec
seed-set = ${repetition}
num-rngs = 3
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.vector-recording = false

############### SCTP configuration ##################
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false

############### General PHY parameters ##############
**.downlinkInterference = true
**.uplinkInterference = true
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm
**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 40tti

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

# tcp settings
**.tcp.typename = "Tcp"
**.tcp.advertisedWindow = 65535
**.tcp.tcpAlgorithmClass = "TcpReno"
**.tcp.sackSupport = true

#------------------------------------#
# Config MySimulation
#------------------------------------#
[Config MySimulation]
sim-time-limit=10s
network = simu5g.simulations.nr.mec.test_mec.MyNetwork

############# Floorplan parameters ################
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### CA configuration #################
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50

*.gnb*.cellularNic.numCarriers = 1
*.gnb*.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

############### BS position (4 gNBs) #################
*.gnb1.mobility.initialX = 250m
*.gnb1.mobility.initialY = 400m
*.gnb2.mobility.initialX = 750m
*.gnb2.mobility.initialY = 400m
*.gnb3.mobility.initialX = 250m
*.gnb3.mobility.initialY = 600m
*.gnb4.mobility.initialX = 750m
*.gnb4.mobility.initialY = 600m

############## UE configuration ##################
*.numUe = 80

# Associate UEs to specific gNBs for testing 
# (This helps visually, though dynamic association will override if signal is better)
*.ue[*].macCellId = 0
*.ue[*].masterId = 0
*.ue[*].nrMacCellId = 1
*.ue[*].nrMasterId = 1
**.dynamicCellAssociation = true
**.enableHandover = true

############ UEs position (80 UEs, 4 Groups) #################
# Placing 20 UEs to the RIGHT of each gNB
# We use uniform() to spread them slightly so they aren't stacked on one pixel.

*.ue[*].mobility.typename = "StationaryMobility"

# --- Group 1: Right of gnb1 (X=250, Y=400) ---
# Range: ue[0] to ue[19]
*.ue[0..19].mobility.initialX = uniform(280m, 320m)
*.ue[0..19].mobility.initialY = uniform(380m, 420m)

# --- Group 2: Right of gnb2 (X=750, Y=400) ---
# Range: ue[20] to ue[39]
*.ue[20..39].mobility.initialX = uniform(780m, 820m)
*.ue[20..39].mobility.initialY = uniform(380m, 420m)

# --- Group 3: Right of gnb3 (X=250, Y=600) ---
# Range: ue[40] to ue[59]
*.ue[40..59].mobility.initialX = uniform(280m, 320m)
*.ue[40..59].mobility.initialY = uniform(580m, 620m)

# --- Group 4: Right of gnb4 (X=750, Y=600) ---
# Range: ue[60] to ue[79]
*.ue[60..79].mobility.initialX = uniform(780m, 820m)
*.ue[60..79].mobility.initialY = uniform(580m, 620m)


############# MEC APP CONFIGURATION (Dynamic) ################
*.ue[*].numApps = 2

# App 0: DeviceApp (Client Manager)
*.ue[*].app[0].typename = "DeviceApp"
*.ue[*].app[0].localPort = 4500
*.ue[*].app[0].ualcmpAddress = "ualcmp"
*.ue[*].app[0].ualcmpPort = 1000
*.ue[*].app[0].appPackageSource = "ApplicationDescriptors/WarningAlertApp.json"

# App 1: Traffic Generator (1400B @ 1ms)
*.ue[*].app[1].typename = "UeWarningAlertApp"
*.ue[*].app[1].deviceAppAddress = "ue["+string(ancestorIndex(1))+"]"
*.ue[*].app[1].deviceAppPort = 4500
*.ue[*].app[1].period = 0.001s
*.ue[*].app[1].packetSize = 1400B 
*.ue[*].app[1].startTime = 1s
*.ue[*].app[1].stopTime = 35s
# Note: Position parameters are usually not needed for Stationary UEs but kept for safety
*.ue[*].app[1].positionX = 600m
*.ue[*].app[1].positionY = 600m
############# MEC APP CONFIGURATION (Dynamic) ################
# REPLACED STATIC UDP WITH DYNAMIC MEC APPS
# This setup forces the Orchestrator to "send" (instantiate) the app on the host.

*.ue[*].numApps = 2

# --- App 0: DeviceApp (The MEC Client Manager) ---
# This app talks to the Orchestrator to request the service.
*.ue[*].app[0].typename = "DeviceApp"
*.ue[*].app[0].localPort = 4500
*.ue[*].app[0].ualcmpAddress = "ualcmp"
*.ue[*].app[0].ualcmpPort = 1000
*.ue[*].app[0].appPackageSource = "ApplicationDescriptors/WarningAlertApp.json"

# --- App 1: The Traffic Generator (MEC Version) ---
# Goal: Replicate UDP Basic App stress (1400B @ 1ms)

*.ue[*].app[1].typename = "UeWarningAlertApp"
*.ue[*].app[1].deviceAppAddress = "ue["+string(ancestorIndex(1))+"]"
*.ue[*].app[1].deviceAppPort = 4500

# 1. TIMING (Replaces sendInterval)
# "period" controls how often the app sends a warning message
*.ue[*].app[1].period = 0.001s   # 1ms interval

# 2. SIZE (Replaces messageLength)
# "packetSize" sets the payload size. 
# Note: If the C++ code for WarningAlertApp has a fixed size, this might be ignored, 
# but this is the standard parameter to attempt to force the size.
*.ue[*].app[1].packetSize = 1400B 

# 3. OPERATION
*.ue[*].app[1].startTime = 1s
*.ue[*].app[1].stopTime = 35s
*.ue[*].app[1].positionX = 600m
*.ue[*].app[1].positionY = 600m

############ MEC Configuration ############

# 1. LINK ORCHESTRATOR (Fixes Popup)
*.mecHost*.mecPlatformManager.mecOrchestrator = "mecOrchestrator"

# 2. INFRASTRUCTURE & RESOURCES
**.mecHost*.virtualisationInfrastructure.ipv4.forwarding = true
*.mecHost*.maxRam = 32GB
*.mecHost*.maxDisk = 100TB

# CRITICAL: Give both hosts enough CPU to run the apps (Your JSON needs 1500)
*.mecHost*.maxCpuSpeed = 400000 

# 3. NETWORK CONNECTION
*.mecHost*.bsList = ["gnb1", "gnb2", "gnb3", "gnb4"]

# 4. ENABLE SERVICES (CRITICAL FOR MECHOST 2)
# Your JSON requires "LocationService". We must enable it on BOTH hosts.

# --- Host 1 Services ---
*.mecHost1.mecPlatform.numMecServices = 1
*.mecHost1.mecPlatform.mecService[0].typename = "LocationService"
*.mecHost1.mecPlatform.mecService[0].localAddress = "mecHost1.virtualisationInfrastructure"
*.mecHost1.mecPlatform.mecService[0].localPort = 10020
*.mecHost1.mecPlatform.serviceRegistry.localAddress = "mecHost1.virtualisationInfrastructure"
*.mecHost1.mecPlatform.serviceRegistry.localPort = 10021

# --- Host 2 Services ---
*.mecHost2.mecPlatform.numMecServices = 1
*.mecHost2.mecPlatform.mecService[0].typename = "LocationService"
*.mecHost2.mecPlatform.mecService[0].localAddress = "mecHost2.virtualisationInfrastructure"
*.mecHost2.mecPlatform.mecService[0].localPort = 10020
*.mecHost2.mecPlatform.serviceRegistry.localAddress = "mecHost2.virtualisationInfrastructure"
*.mecHost2.mecPlatform.serviceRegistry.localPort = 10021

# --- Service Timings (Boilerplate) ---
*.mecHost*.mecPlatform.serviceRegistry.rng-0 = 0
*.mecHost*.mecPlatform.serviceRegistry.rng-1 = 1
*.mecHost*.mecPlatform.mecService[0].rng-0 = 0
*.mecHost*.mecPlatform.mecService[0].rng-1 = 1
*.mecHost*.mecPlatform.mecService[0].requestServiceTime = 20us
*.mecHost*.mecPlatform.mecService[0].subscriptionServiceTime = 11us

# 5. ORCHESTRATOR POLICY (LOAD BALANCING)
*.mecOrchestrator.mecHostList = ["mecHost1", "mecHost2"]
*.mecOrchestrator.mecApplicationPackageList = ["WarningAlertApp"] 

# Use Resource-Based Policy so it checks if Host 1 is full
*.mecOrchestrator.selectionPolicy = "AvailableResourcesBased"

# THE TRICK: Limit Host 1 to 2 apps only. 
# This forces UEs #3 and #4 to spill over to Host 2.
*.mecHost1.maxMecApps = 2
*.mecHost2.maxMecApps = 10

# 6. CLEANUP
# Ensure no static apps interfere (Orchestrator handles everything)
*.mecHost*.numApps = 0