[Config Scaled_Up_Traffic]
network = simu5g.simulations.lte.networks.mymapp
sim-time-limit = 10s

# --- 1. DEFINE 80 USERS ---
*.numUe = 80

# --- 2. ASSIGN 20 USERS PER TOWER ---
# UEs 0-19 go to Tower 1
*.ue[0..19].macCellId = 1
*.ue[0..19].masterId = 1

# UEs 20-39 go to Tower 2
*.ue[20..39].macCellId = 2
*.ue[20..39].masterId = 2

# UEs 40-59 go to Tower 3
*.ue[40..59].macCellId = 3
*.ue[40..59].masterId = 3

# UEs 60-79 go to Tower 4
*.ue[60..79].macCellId = 4
*.ue[60..79].masterId = 4

# --- 3. TRAFFIC (80 Video Streams) ---
# Create 80 Apps on the Server (1 for each UE)
*.server.numApps = 80

# Common Settings (Video Streaming)
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destPort = 1000
*.server.app[*].messageLength = 1000B
*.server.app[*].sendInterval = 10ms # Streaming video
*.server.app[*].startTime = uniform(0s, 0.1s)

# AUTO-TARGETING
# This assumes the NED file has ue[0]...ue[79]
*.server.app[*].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"

# --- 4. UE RECEIVER SETTINGS ---
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].localPort = 1000

# --- 5. STANDARD SETTINGS ---
# Use the Single Unified PGW
**.eNodeB*.pgwAddr = "mymapp.pgw"
**.eNodeB*.pgwAddress = "mymapp.pgw"

# Tower IDs
*.eNodeB1.macCellId = 1
*.eNodeB1.macNodeId = 1
*.eNodeB2.macCellId = 2
*.eNodeB2.macNodeId = 2
*.eNodeB3.macCellId = 3
*.eNodeB3.macNodeId = 3
*.eNodeB4.macCellId = 4
*.eNodeB4.macNodeId = 4

# Power & Config
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.forwarding = true
*.configurator.config = xmldoc("./demo.xml")

# --- VISUAL PLACEMENT (Shifted Below Towers) ---
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initFromDisplayString = false 

# Group 1 (Below Tower 1)
# X is centered on 100, Y is pushed down to 450-550
*.ue[0..19].mobility.initialX = uniform(50m, 150m)
*.ue[0..19].mobility.initialY = uniform(450m, 550m)

# Group 2 (Below Tower 2)
# X is centered on 300
*.ue[20..39].mobility.initialX = uniform(250m, 350m)
*.ue[20..39].mobility.initialY = uniform(450m, 550m)

# Group 3 (Below Tower 3)
# X is centered on 700
*.ue[40..59].mobility.initialX = uniform(650m, 750m)
*.ue[40..59].mobility.initialY = uniform(450m, 550m)

# Group 4 (Below Tower 4)
# X is centered on 900
*.ue[60..79].mobility.initialX = uniform(850m, 950m)
*.ue[60..79].mobility.initialY = uniform(450m, 550m)